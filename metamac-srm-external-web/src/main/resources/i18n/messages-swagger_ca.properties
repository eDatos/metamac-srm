api.doc.swagger.info.description                                                                                                                     = Els recursos estructurals són aquells que serveixen de suport per a normalitzar als recursos estadístics que produeix l'organització. Els principals recursos estructurals existents són els esquemes d'organitzacions, esquemes de temes, esquemes de conceptes, classificacions i definicions d'estructures de dades. Aquesta API permet consultar l'inventari complet dels recursos estructurals que maneja l'organització
