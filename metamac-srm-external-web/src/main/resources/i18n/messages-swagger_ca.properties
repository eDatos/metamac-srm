api.doc.swagger.paths.v1_0.codelistfamilies.get.parameters.3.description                                                                             = <div>Consulta per a filtrar els resultats</div><div>Operadors vàlids:<ul><li>EQ: igual, </li><li>IEQ: igual sense distinció de majúscules, </li><li>LIKE: patró de cerca, </li><li>ILIKE: patró sense distinció de majúscules, </li><li>NE: no igual, </li><li>LT: menor que, </li><li>LI: menor o igual, </li><li>GT: major que, </li><li>GE: major o igual, </li><li>IS_NULL: valor nul, </li><li>IS_NOT_NULL: valor no nul, </li><li>IN: valor dins d'un conjunt</li></ul><div>Camps vàlids:<ul><li>ID</li> <li>URN</li> <li>NAME</li></ul>Exemple: query=ID EQ 2090<div>
